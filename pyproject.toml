[build-system]
requires = ["setuptools>=68"]         # PEP 660 editable support ke liye naya setuptools
build-backend = "setuptools.build_meta"


[project]
name = "automated-research-report"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel==7.3.0",
    "structlog==25.4.0",
    "langgraph==1.2.5",
    "langchain_community==0.4.2",
    "langchain_core>=1.4.7",
    "tavily-python>=0.7.26",
    "wikipedia>=1.4.0",
    "langchain_openai==1.3.2",
    "langchain-google-genai==4.2.5",
    "langchain-groq==1.1.3"

]

# Optional: authors, license
authors = [{ name = "Krishna Chaitanya J"}]
license = { text = "Proprietary"}


[tool.setuptools.packages.find]
where = ["."]
include = ["research_and_analysts*"]
